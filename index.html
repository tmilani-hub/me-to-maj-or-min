<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>text to maj</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<h1>Site pour transformer des minuscule en majuscule ou inversement</h1>
		<main>
			<label>
				<p>\/ Ta phrase \/</p>
				<input
					id="TEXT"
					type="text"
					class="INPtext"
					placeholder="ecris ta phrase" />
			</label>
			<div class="flex row">
				<label class="forCheck">
					<input
						id="maj_to_min"
						type="radio"
						name="changeSentence"
						class="INPcheck" />
					tout min
				</label>
				<label class="forCheck">
					<input
						id="min_to_maj"
						type="radio"
						name="changeSentence"
						class="INPcheck" />
					TOUT maj
				</label>
				<label class="forCheck">
					<input
						id="min_to_maj"
						type="radio"
						name="changeSentence"
						class="INPcheck" />
					Maj au début de phrase
				</label>
			</div>
			<div class="enjoliveur">
				<p id="result">Le résultat apparai ici</p>
			</div>
			<button id="copie" type="button" class="btn-normal">
				click ici pour copier
			</button>
		</main>
		<script src="app.js"></script>
	</body>
</html>
